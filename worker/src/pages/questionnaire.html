<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<style>
  :root { --ink:#1c2230; --muted:#5d6676; --line:#dfe3ea; --accent:#2f5bd3; --bg:#f6f7f9; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8ebf1; --muted:#a3abb9; --line:#2c3442; --accent:#7ea2ff; --bg:#12161d; --card:#1a1f28; } }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: .92rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:14px 0; }
  .q { font-weight:600; margin-bottom:10px; }
  h2 { font-size: 1.1rem; margin: 26px 0 4px; }
  .row { display:flex; gap:10px; margin-bottom:10px; }
  .row > * { flex:1; }
  select, input[type=date] { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; color:inherit; background:transparent; }
  .card input[type=text] + input, .card select + input { margin-top: 10px; }
  textarea, input[type=text] { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; color:inherit; background:transparent; }
  textarea { min-height: 110px; resize: vertical; }
  .yn { display:flex; gap:10px; }
  .yn label { flex:1; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; cursor:pointer; }
  .yn input { margin-right:6px; }
  button { width:100%; border:0; border-radius:10px; padding:14px; font:600 1rem/1 inherit; background:var(--accent); color:#fff; cursor:pointer; }
  .note { font-size:.85rem; color:var(--muted); margin-top:16px; }
  .ok { text-align:center; padding: 48px 16px; }
</style>
</head>
<body>
<main>
{{BODY}}
</main>
</body>
</html>
